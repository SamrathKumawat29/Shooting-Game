<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Dashboard</title>

    <link rel="stylesheet" href="../css/style.css" />
  </head>

  <body>
    <div class="dashboard-container">
      <h1>Statistics Dashboard</h1>

      <div class="dashboard-grid">
        <div class="card">
          <h2 id="users">0</h2>
          <p>Total Users</p>
        </div>

        <div class="card">
          <h2 id="missions">0</h2>
          <p>Missions Completed</p>
        </div>

        <div class="card">
          <h2 id="ships">0</h2>
          <p>Ships Destroyed</p>
        </div>

        <div class="card">
          <h2 id="accuracy">0%</h2>
          <p>Accuracy</p>
        </div>

        <div class="card">
          <h2 id="time">0h</h2>
          <p>Total Play Time</p>
        </div>
      </div>

      <br />

      <button onclick="location.href = 'menu.html'">Back</button>
    </div>

    <script src="../js/dashboard.js"></script>
  </body>
</html>
